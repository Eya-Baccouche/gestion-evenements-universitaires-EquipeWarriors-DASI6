server:
  port: 8086

spring:
  application:
    name: fidelite
  profiles:
    # "dev" par defaut pour les tests locaux (securite JWT desactivee, donnees de demo).
    # En production / Docker : SPRING_PROFILES_ACTIVE=prod (securite Keycloak active).
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # optional : le service demarre meme si le config-server n'est pas pret
    import: "optional:configserver:http://localhost:8888"
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/fidelite}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}      # pas de vrais mots de passe dans le depot public
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBIT_LISTENER_ENABLED:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/events}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# Bareme et seuils (scenario Fidelite & Recompenses) - modifiables sans toucher au code
fidelite:
  points:
    participation: 50
    avis: 20
    victoire-hackathon: 300
  niveaux:
    seuil-silver: 200
    seuil-gold: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html
